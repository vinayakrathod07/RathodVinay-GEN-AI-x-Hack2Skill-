# Netlify Deployment Configuration for PhishGuard Nexus
[build]
  publish = "dist"
  command = "npm run build"

# Single-Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Security & Hardware Permissions Headers
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "SAMEORIGIN"
      X-XSS-Protection = "1; mode=block"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      # Explicitly grant camera permission for QR flyer scanning & microphone for voice copilot
      Permissions-Policy = "camera=(self), microphone=(self)"

# High-performance asset caching
[[headers]]
  for = "/assets/*"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"
